name: Bug report
description: Something behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security issues here — see
        [SECURITY.md](https://github.com/KevinTCoughlin/godot-xdg-portals/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        Called XDGPortal.inhibit(XDGPortal.InhibitFlags.IDLE, "Cutscene").
        Expected a request handle; got an empty string.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: >-
        Ideally the steps against the demo project (demo/demo.tscn), or a minimal
        script.
    validations:
      required: true

  - type: input
    id: addon-version
    attributes:
      label: Addon version
      placeholder: "0.1.0, or a commit SHA"
    validations:
      required: true

  - type: input
    id: godot-version
    attributes:
      label: Godot version
      placeholder: "4.4.1.stable"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Which backend is active?
      description: "`print(XDGPortal.get_backend_name())`"
      options:
        - native
        - "null"
        - mock
        - "not sure"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Distribution, desktop environment and session type, the output of
        `xdg-desktop-portal --version`, and whether you are running in a Flatpak.
      placeholder: |
        Fedora 41, GNOME 47, Wayland
        xdg-desktop-portal 1.18.4
        Flatpak: no
    validations:
      required: true

  - type: textarea
    id: debug-log
    attributes:
      label: Debug output
      description: >-
        For native-backend problems, run with `XDG_PORTALS_DEBUG=1` and paste the
        `[xdg_portals]` lines along with any errors.
      render: text
