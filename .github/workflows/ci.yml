name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build (${{ matrix.arch }}, ${{ matrix.target }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release, editor]
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Install GLib/GIO development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config libglib2.0-dev

      - name: Cache godot-cpp checkout
        uses: actions/cache@v6
        with:
          path: build-${{ matrix.target }}/_deps
          key: godot-cpp-${{ matrix.arch }}-${{ matrix.target }}-${{ hashFiles('CMakeLists.txt') }}

      # CI holds the code to every warning; source builds default to OFF.
      - name: Build
        run: ./scripts/build.sh --target ${{ matrix.target }} --werror

      # Reuses this build's compile_commands.json. One configuration is
      # enough: the analysed sources do not vary by target or architecture.
      - name: Install uv
        if: matrix.target == 'editor' && matrix.arch == 'x86_64'
        uses: astral-sh/setup-uv@v10.2.0

      - name: clang-tidy
        if: matrix.target == 'editor' && matrix.arch == 'x86_64'
        run: ./scripts/check.sh clang-tidy

      - name: Verify the library exports the GDExtension entry point
        run: |
          set -euo pipefail
          library="addons/xdg_portals/bin/libxdg_portals.linux.${{ matrix.target }}.${{ matrix.arch }}.so"
          test -f "$library"
          nm -D --defined-only "$library" | grep -q ' xdg_portals_library_init$'
          echo "Found xdg_portals_library_init in $library"

      - uses: actions/upload-artifact@v7
        with:
          name: libxdg_portals-linux-${{ matrix.arch }}-${{ matrix.target }}
          path: addons/xdg_portals/bin/*.so

  macos:
    name: macOS build (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [template_release, editor]
    steps:
      - uses: actions/checkout@v7

      - name: Cache godot-cpp checkout
        uses: actions/cache@v6
        with:
          path: build-${{ matrix.target }}/_deps
          key: godot-cpp-macos-${{ matrix.target }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        run: ./scripts/build.sh --target ${{ matrix.target }}

      # The runner has no battery, so Low Power Mode can never flip here and
      # the state transition cannot be exercised in CI at all. What this job
      # does prove is that the library builds for both architectures, exports
      # the entry point, and links against Foundation and nothing else.
      - name: Verify the library is universal and exports the entry point
        run: |
          set -euo pipefail
          library="addons/xdg_portals/bin/libxdg_portals.macos.${{ matrix.target }}.dylib"
          test -f "$library"
          lipo -info "$library"
          lipo -info "$library" | grep -q 'x86_64'
          lipo -info "$library" | grep -q 'arm64'
          nm -gU "$library" | grep -q '_xdg_portals_library_init$'
          echo "Found xdg_portals_library_init in $library"
          otool -L "$library" | grep -q 'Foundation.framework'

      - uses: actions/upload-artifact@v7
        with:
          name: libxdg_portals-macos-${{ matrix.target }}
          path: addons/xdg_portals/bin/*.dylib
          if-no-files-found: error

  tests:
    name: Godot test suite (${{ matrix.godot_version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        godot_version: [4.4.1, 4.7.2]
    env:
      GODOT_VERSION: ${{ matrix.godot_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${archive}.zip"
          curl --fail --location --silent --show-error --output godot.zip "$url"
          unzip -q godot.zip
          chmod +x "$archive"
          sudo mv "$archive" /usr/local/bin/godot
          godot --headless --version

      # The suite is entirely mock-backed: it needs neither a display nor a
      # session bus, so it is deterministic on a bare runner.
      - name: Run the mock-backed test suite
        run: ./scripts/run_tests.sh

  native-smoke:
    name: Native backend vs. fake portal (${{ matrix.arch }}, ${{ matrix.godot_version }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        godot_version: [4.4.1, 4.7.2]
        arch: [x86_64, arm64]
    env:
      GODOT_VERSION: ${{ matrix.godot_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build and D-Bus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config libglib2.0-dev dbus

      - name: Install Godot
        run: |
          set -euo pipefail
          godot_arch=x86_64
          if [ "${{ matrix.arch }}" = arm64 ]; then godot_arch=arm64; fi
          archive="Godot_v${GODOT_VERSION}-stable_linux.${godot_arch}"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${archive}.zip"
          curl --fail --location --silent --show-error --output godot.zip "$url"
          unzip -q godot.zip
          chmod +x "$archive"
          sudo mv "$archive" /usr/local/bin/godot

      # Shares the architecture-specific key with the editor native-build job:
      # both populate build-editor/_deps with the same pinned godot-cpp checkout.
      - name: Cache godot-cpp checkout
        uses: actions/cache@v6
        with:
          path: build-editor/_deps
          key: godot-cpp-${{ matrix.arch }}-editor-${{ hashFiles('CMakeLists.txt') }}

      - name: Build the editor-target library
        run: ./scripts/build.sh --target editor

      # Runs the real GIO code path against a scripted fake portal on a private
      # session bus. It does not stand in for the desktop checklist in
      # docs/native-testing.md, which needs a graphical session and a human.
      # One pass per fake-portal mode: default, immediate (0 ms Response),
      # slow-start, restart and wedged-bus. See docs/native-testing.md.
      - name: Run the native smoke test
        run: ./scripts/run_native_smoke.sh

  sanitizers:
    name: Native smoke test under ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSIONS: 4.4.1 4.7.2
    steps:
      - uses: actions/checkout@v7

      - name: Install build and D-Bus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config libglib2.0-dev dbus

      - name: Install Godot
        run: |
          set -euo pipefail
          for version in $GODOT_VERSIONS; do
            archive="Godot_v${version}-stable_linux.x86_64"
            url="https://github.com/godotengine/godot/releases/download/${version}-stable/${archive}.zip"
            curl --fail --location --silent --show-error --output godot.zip "$url"
            unzip -q godot.zip
            chmod +x "$archive"
            sudo mv "$archive" "/usr/local/bin/godot-${version}"
            rm godot.zip
          done

      - name: Cache godot-cpp checkout
        uses: actions/cache@v6
        with:
          path: build-editor-sanitize/_deps
          key: godot-cpp-x86_64-editor-sanitize-${{ hashFiles('CMakeLists.txt') }}

      - name: Build the editor-target library with ASan and UBSan
        run: ./scripts/build.sh --target editor --sanitize --werror

      # Godot is not instrumented, so the script preloads the ASan runtime into
      # it (and a shim that lets it load an extension; see
      # tests/native/sanitizer_preload.c). Leak checking is on, with the
      # documented suppressions in tests/native/lsan.supp.
      - name: Run the native smoke test under the sanitizers
        run: |
          set -euo pipefail
          for version in $GODOT_VERSIONS; do
            echo "::group::Godot ${version}"
            GODOT="godot-${version}" ./scripts/run_native_smoke.sh --sanitize
            echo "::endgroup::"
          done

  lint:
    name: Formatting and lint (clang-format, gdformat, gdlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # Tool versions are pinned in scripts/check.sh and run through uvx, so
      # these match a local `scripts/check.sh lint` exactly.
      - name: clang-format
        run: ./scripts/check.sh clang-format
      - name: gdformat and gdlint
        run: ./scripts/check.sh gdscript

  scripts:
    name: Shell scripts (bash -n, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: bash -n
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "ok $script"
          done
      - uses: astral-sh/setup-uv@v10.2.0
      - name: shellcheck
        run: ./scripts/check.sh shell

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
