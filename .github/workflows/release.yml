name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package Linux ${{ matrix.arch }} addon archive
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Packaging version ${version}"

      - name: Install GLib/GIO development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config libglib2.0-dev

      # The editor target ships too: without it the addon falls back to the null
      # backend when a project is run from the Godot editor.
      - name: Build the release, debug and editor libraries
        run: |
          ./scripts/build.sh --target template_release
          ./scripts/build.sh --target template_debug
          ./scripts/build.sh --target editor

      - name: Stage the archive
        id: stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|aarch64) ;;
            *) echo "Unexpected runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          actual_arch="$(uname -m)"
          if [ "$actual_arch" = aarch64 ]; then actual_arch=arm64; fi
          test "$actual_arch" = "$ARCH"
          name="godot-xdg-portals-${VERSION}-linux-${ARCH}"
          stage="dist/${name}"
          mkdir -p "${stage}/addons"
          cp -r addons/xdg_portals "${stage}/addons/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md "${stage}/"

          # The archive ships only what a consumer installs: no build trees, no
          # editor caches, no test or demo sources.
          test -f "${stage}/addons/xdg_portals/bin/libxdg_portals.linux.template_release.${ARCH}.so"
          test -f "${stage}/addons/xdg_portals/bin/libxdg_portals.linux.template_debug.${ARCH}.so"
          test -f "${stage}/addons/xdg_portals/bin/libxdg_portals.linux.editor.${ARCH}.so"
          test -f "${stage}/addons/xdg_portals/xdg_portals.gdextension"
          test -f "${stage}/addons/xdg_portals/plugin.cfg"
          test -f "${stage}/addons/xdg_portals/desktop_services.gd"
          test -f "${stage}/README.md"
          test -f "${stage}/LICENSE"
          test -f "${stage}/THIRD_PARTY_NOTICES.md"

          (cd dist && zip -q -r "${name}.zip" "${name}")
          (cd dist && sha256sum "${name}.zip" > "${name}.zip.sha256")
          unzip -l "dist/${name}.zip"
          echo "archive=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${name}.zip.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: godot-xdg-portals-linux-${{ matrix.arch }}
          path: |
            ${{ steps.stage.outputs.archive }}
            ${{ steps.stage.outputs.checksum }}
          if-no-files-found: error

      # The raw libraries feed the combined Asset Store archive below.
      - uses: actions/upload-artifact@v7
        with:
          name: libxdg_portals-linux-${{ matrix.arch }}
          path: addons/xdg_portals/bin/*.so
          if-no-files-found: error

  macos:
    name: Build macOS libraries
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # xdg_portals.gdextension lists all three macOS targets, and the Asset
      # Store rejects archives missing any library a .gdextension names.
      - name: Build the release, debug and editor libraries
        run: |
          ./scripts/build.sh --target template_release
          ./scripts/build.sh --target template_debug
          ./scripts/build.sh --target editor

      - name: Verify the libraries are universal
        run: |
          set -euo pipefail
          for target in template_release template_debug editor; do
            library="addons/xdg_portals/bin/libxdg_portals.macos.${target}.dylib"
            lipo -info "$library"
            lipo -info "$library" | grep -q x86_64
            lipo -info "$library" | grep -q arm64
            nm -gU "$library" | grep -q '_xdg_portals_library_init$'
          done

      - uses: actions/upload-artifact@v7
        with:
          name: libxdg_portals-macos
          path: addons/xdg_portals/bin/*.dylib
          if-no-files-found: error

  store:
    name: Assemble Asset Store archive
    needs: [package, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: libxdg_portals-*
          path: addons/xdg_portals/bin
          merge-multiple: true

      # One archive for every platform, rooted at addons/ as the store expects,
      # with the licence and readme inside the plugin folder (users keep that
      # folder, not the repository root).
      - name: Stage the archive
        id: stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="godot-xdg-portals-${VERSION}-asset-store"
          stage="dist/${name}"
          mkdir -p "${stage}/addons"
          cp -r addons/xdg_portals "${stage}/addons/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md "${stage}/addons/xdg_portals/"
          find "${stage}" -mindepth 1 -name '.*' -prune -exec rm -rf {} +

          # Every library the .gdextension names must be in the archive.
          grep -o 'res://[^"]*' addons/xdg_portals/xdg_portals.gdextension | sort -u |
            while read -r path; do
              if [ ! -f "${stage}/${path#res://}" ]; then
                echo "Missing ${path}" >&2
                exit 1
              fi
            done

          (cd "${stage}" && zip -q -r "../${name}.zip" addons)
          (cd dist && sha256sum "${name}.zip" > "${name}.zip.sha256")
          unzip -l "dist/${name}.zip"
          echo "archive=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${name}.zip.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: godot-xdg-portals-asset-store
          path: |
            ${{ steps.stage.outputs.archive }}
            ${{ steps.stage.outputs.checksum }}
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [package, store]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: godot-xdg-portals-*
          path: dist
          merge-multiple: true

      - name: Publish the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
