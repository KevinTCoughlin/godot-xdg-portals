name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Only the deploy job needs write access; nothing here touches the repository.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the project site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The site is a single static file with no build step and no external
      # assets, so there is nothing to compile — site/ is uploaded as-is.
      - name: Check the site is self-contained
        run: |
          set -euo pipefail
          test -f site/index.html
          if grep -nE '(src|href)="https?://(cdn|unpkg|fonts)' site/index.html; then
            echo "The page must not depend on external assets." >&2
            exit 1
          fi
          echo "site/index.html is self-contained."

      # `enablement: true` turns Pages on through the API when it has never been
      # configured, instead of failing with "Get Pages site failed". Without it
      # the first deploy needs a human to set Settings -> Pages -> Source to
      # "GitHub Actions" before this workflow can ever succeed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
